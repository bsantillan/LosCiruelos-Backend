spring.application.name=padel-club-api

# Puerto HTTP (por defecto 8080). En Windows con Docker Desktop el rango alrededor de
# 8080 puede quedar reservado: definir SERVER_PORT con otro (ej. 9090)
server.port=${SERVER_PORT:8080}

# Detrás de un proxy (Tailscale Funnel, nginx, …) la IP del cliente llega en X-Forwarded-For:
# sin esto, el rate limiting vería a todos los usuarios con la IP del proxy. Si el backend se
# expone directo a internet, sin proxy, usar FORWARD_HEADERS_STRATEGY=none (el header se podría falsificar)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Admin
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# Usuario de prueba user.prueba@losciruelos.com (solo para desarrollo)
app.seed.usuario-prueba=${APP_SEED_USUARIO_PRUEBA:false}

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Fechas del JSON: texto ISO en hora de Argentina (los formatos están en Config/Fechas).
# En Jackson 3 WRITE_DATES_AS_TIMESTAMPS está en datatype.datetime, no en serialization.
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# FlyWay
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/Migrations
# Sin baseline: si la base ya tiene tablas pero no historial de Flyway, falla en vez de
# saltear V1 en silencio (en desarrollo: docker compose down -v y volver a levantar)
spring.flyway.baseline-on-migrate=false

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration=900
refresh_token.expiration=604800

# Cambiá solo esta línea para cambiar de proveedor
email.provider=gmail
email.from=${EMAIL_FROM}

payment.provider=mercadopago

# Google
google.client-id=${GOOGLE_CLIENT_ID}

# Config Email
spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-url=${MP_WEBHOOK_URL}
# URL del frontend: Mercado Pago devuelve al cliente a FRONTEND_URL/pago/resultado después de pagar
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Clave secreta de los webhooks (Tus integraciones > Webhooks). Opcional: si falta no se valida la firma.
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# WhatsApp (Cloud API oficial de Meta). Sin token o sin número los avisos van por mail.
# Ver docs/whatsapp.md para dar de alta el número y cargar las plantillas.
# Proveedor de WhatsApp (hoy solo "meta", como email.provider para el mail)
whatsapp.provider=meta
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api-version=v23.0
whatsapp.idioma=es_AR
whatsapp.plantilla-codigo=codigo_verificacion_v2
# Topes de códigos de verificación por WhatsApp (cada uno cuesta): por usuario y por número cada 24 h,
# y segundos mínimos entre pedidos del mismo usuario
telefono.codigos-por-dia-usuario=5
telefono.codigos-por-dia-numero=5
telefono.segundos-entre-codigos=60

# Config SendGrid (dejalo aunque no lo uses, no rompe nada si las props no se leen)
# sendgrid.api-key=SG.xxxx
# sendgrid.verify-email-template-id=d-xxxx
# sendgrid.reset-password-template-id=d-xxxx